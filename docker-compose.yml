services:
  epub2audiobook:
    build: .
    container_name: epub2audiobook
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Persistent storage for uploads, output, and database
      - ./data/uploads:/data/uploads
      - ./data/output:/data/output
      - ./data/db:/data/db
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DATABASE_PATH=/data/db/epub2audiobook.db
      - FLASK_ENV=production
    # Resource limits (adjust based on your server)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

